<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Resume Screening System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>AI Resume Screening System</h1>

            <p>
                Analyze your resume against a job description
                using AI-powered skill matching.
            </p>

        </div>


        <form action="/analyze"
              method="POST"
              enctype="multipart/form-data">


            <div class="form-group">

                <label>
                    Upload Resume
                </label>

                <input
                    type="file"
                    name="resume"
                    accept=".pdf,.docx"
                    required
                >

                <small>
                    Supported formats: PDF, DOCX
                </small>

            </div>


            <div class="form-group">

                <label>
                    Job Description
                </label>

                <textarea
                    name="job_description"
                    rows="12"
                    placeholder="Paste the Job Description here..."
                    required
                ></textarea>

            </div>


            <button type="submit">

                Analyze Resume

            </button>


        </form>

    </div>

</body>

</html>
